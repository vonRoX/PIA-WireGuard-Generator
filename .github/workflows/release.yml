name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that has not passed its own tests.
      - name: Test
        run: npm test

      # Neutralino cross-compiles every target from one runner. The build script
      # ends in verify-build.mjs, which fails the job if no binary was produced.
      - name: Build
        run: npm run build

      - name: Assemble assets
        run: |
          set -euo pipefail

          # Ship the per-platform executables and nothing else. `neu build` also
          # writes a zip of all of them plus a resources.neu, which these builds
          # embed and do not need — publishing it only raises "which one do I
          # download?", which is the question issue #1 was about.
          mkdir -p assets
          find dist -type f -name 'pia-wireguard-generator-*' ! -name '*.zip' -exec cp {} assets/ \;

          cd assets
          sha256sum * > SHA256SUMS
          echo "--- publishing ---"
          ls -lh
          cat SHA256SUMS

      - name: Compose release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          {
            echo "## Download one file"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows | \`pia-wireguard-generator-win_x64.exe\` |"
            echo "| macOS (Intel + Apple Silicon) | \`pia-wireguard-generator-mac_universal\` |"
            echo "| Linux | \`pia-wireguard-generator-linux_x64\` (also \`arm64\`, \`armhf\`) |"
            echo
            echo "No installer, nothing written outside the folder you put it in, 2–4 MB each."
            echo
            echo "**macOS and Linux** need the executable bit, and macOS needs the quarantine flag"
            echo "cleared because the binary is not notarized:"
            echo
            echo '```bash'
            echo "chmod +x pia-wireguard-generator-*"
            echo "xattr -d com.apple.quarantine pia-wireguard-generator-mac_universal   # macOS only"
            echo '```'
            echo
            echo "**Windows** SmartScreen will warn that the publisher is unknown — the binary is not"
            echo "code-signed. Check it against \`SHA256SUMS\` if you would rather verify than trust:"
            echo
            echo '```powershell'
            echo 'Get-FileHash .\pia-wireguard-generator-win_x64.exe -Algorithm SHA256'
            echo '```'
            echo
            echo "Full instructions, including the Linux webview package: ${REPO_URL}#running-it"
            echo
            echo "## Changes"
            echo
            echo "See [CHANGELOG.md](${REPO_URL}/blob/${TAG}/CHANGELOG.md)."
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets -type f | sort)
          printf 'attaching %d asset(s)\n' "${#files[@]}"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            "${files[@]}"
