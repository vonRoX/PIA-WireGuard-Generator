name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that has not passed its own tests.
      - name: Test
        run: npm test

      # Neutralino cross-compiles every target from one runner. The build script
      # ends in verify-build.mjs, which fails the job if no binary was produced.
      - name: Build
        run: npm run build

      - name: Checksums
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS' -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A plain glob will not recurse into dist/<name>/, so enumerate.
          mapfile -t assets < <(find dist -type f | sort)
          printf 'attaching %d asset(s)\n' "${#assets[@]}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${assets[@]}"
